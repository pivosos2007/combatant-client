import groovy.json.JsonSlurper
import org.objectweb.asm.ClassReader
import org.objectweb.asm.Opcodes
import org.objectweb.asm.Type
import org.objectweb.asm.tree.AnnotationNode
import org.objectweb.asm.tree.ClassNode
import org.objectweb.asm.tree.MethodNode

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // ViaFabricPlus / ViaVersion
        url = 'https://repo.viaversion.com/everything'
    }
    maven {
        // ViaBedrock snapshots (dependency of ViaFabricPlus)
        url = 'https://repo.opencollab.dev/maven-snapshots/'
    }
    maven {
        // ViaBedrock snapshots (alt repo used by Via* stack)
        url = 'https://maven.lenni0451.net/snapshots'
    }
    maven {
        // JitPack (for com.github.* artifacts like CubeConverter)
        url = 'https://jitpack.io'
    }
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'
    }
    maven {
        url = uri("$rootDir/local-maven")
    }
}

version = providers.gradleProperty("mod_version").get()
group = providers.gradleProperty("maven_group").get()

def combatantModId = providers.gradleProperty("mod_id").get()
def combatantModName = providers.gradleProperty("mod_name").get()
def combatantModLicense = providers.gradleProperty("mod_license").get()
def duplexCourierVersion = providers.gradleProperty("duplex_courier_version").get()

base {
    archivesName = providers.gradleProperty("archives_base_name").get()
}

def combatantVulkanDebugEnabled = providers.gradleProperty("combatantVulkanDebug")
        .map { it.toBoolean() }
        .orElse(false)
def combatantDevTaskRequested = gradle.startParameter.taskNames.any { it == "buildDev" || it.endsWith(":buildDev") }
def mixinValidationEnabled = providers.gradleProperty("validateMixins")
        .map { it.toBoolean() }
        .orElse(false)
def combatantDevEnabled = providers.gradleProperty("combatantDev")
        .orElse(providers.gradleProperty("dev"))
        .orElse(providers.gradleProperty("devBuild"))
        .orElse(combatantDevTaskRequested ? "true" : "false")
        .map { it.toBoolean() }
        .orElse(false)
def svgMsdfGeneratedResources = layout.buildDirectory.dir("generated/resources/svgMsdf")
// GLSL block declarations are the sole source of truth for generated UBO/SSBO layouts.
// The generator uses the JDK source-file launcher; no Python/Groovy plugin or runtime reflection.
def generatedUniformResources = layout.buildDirectory.dir("generated/resources/combatantUniforms")
def javetNativeGeneratedResources = layout.buildDirectory.dir("generated/resources/javetNatives")
def javetVersion = "5.0.9"
def targetJavaVersion = 25

sourceSets {
    main {
        resources.srcDir(svgMsdfGeneratedResources)
        resources.srcDir(generatedUniformResources)
    }
    svgMsdfTool {
        java.srcDir("src/svgMsdfTool/java")
        compileClasspath += sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    dev {
        java.srcDir("src/dev/java")
        resources.srcDir("src/dev/resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    duplexCourier {
        java.srcDir("src/duplexCourier/java")
        resources.srcDir("src/duplexCourier/resources")
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    vulkanDebug {
        java.srcDir("src/vulkanDebug/java")
        resources.srcDir("src/vulkanDebug/resources")
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    bundledLibrary
    linuxBundledLibrary
    javetNativeBundle
    mixinValidationProcessor
    modImplementation
    compileOnly.extendsFrom bundledLibrary, linuxBundledLibrary
    runtimeOnly.extendsFrom bundledLibrary, linuxBundledLibrary
    implementation.extendsFrom modImplementation
    runtimeOnly.extendsFrom modImplementation
    devImplementation.extendsFrom implementation
    devCompileOnly.extendsFrom compileOnly
    devAnnotationProcessor.extendsFrom annotationProcessor
    vulkanDebugImplementation.extendsFrom implementation
    vulkanDebugCompileOnly.extendsFrom compileOnly
    vulkanDebugAnnotationProcessor.extendsFrom annotationProcessor
    duplexCourierImplementation.extendsFrom implementation
    duplexCourierCompileOnly.extendsFrom compileOnly
}

loom {
    mods {
        "combatant" {
            sourceSet sourceSets.main
            if (combatantDevEnabled.get()) {
                sourceSet sourceSets.dev
            }
            if (combatantVulkanDebugEnabled.get()) {
                sourceSet sourceSets.vulkanDebug
            }
        }
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    annotationProcessor project(':registry-processor')
    mixinValidationProcessor 'org.projectlombok:lombok:1.18.46'
    mixinValidationProcessor 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    devCompileOnly 'org.projectlombok:lombok:1.18.46'
    devAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
    vulkanDebugCompileOnly 'org.projectlombok:lombok:1.18.46'
    vulkanDebugAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"


    // Renderer targets. Sodium is required; Iris stays optional but available in dev runtime.
    modImplementation "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
    if (providers.gradleProperty("withOptionalModRuntime").map { it.toBoolean() }.orElse(false).get()) {
        runtimeOnly "maven.modrinth:iris:${project.iris_version}"
        runtimeOnly "maven.modrinth:immediatelyfast:${project.immediatelyfast_version}"
    }

    // Xaero is a typed development/runtime integration target. Loom does not bundle
    // modImplementation dependencies into Combatant's distributable jar.
    modImplementation "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
    compileOnly "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"

    // ViaFabricPlus (optional)
    compileOnly "com.viaversion:viafabricplus-api:${project.viafabricplus_version}"
    if (providers.gradleProperty("withViaFabricPlusRuntime").map { it.toBoolean() }.orElse(false).get()) {
        // Dev/runtime only (not bundled) to test locally.
        runtimeOnly "com.viaversion:viafabricplus:${project.viafabricplus_version}"
    }

    // Entity Culling (optional): typed compile-time API for shader ESP visibility compat.
    compileOnly "maven.modrinth:entityculling:${project.entityculling_version}"

    // Litematica (optional): the Printer module reads its placements and schematic world through an isolated adapter
    // (compat.litematica.impl) that is only class-loaded when the mod is present. Compile-only, never bundled.
    compileOnly "maven.modrinth:litematica:${project.litematica_version}"
    compileOnly "maven.modrinth:malilib:${project.malilib_version}"

    bundledLibrary "de.marhali:json5-java:3.0.0"

    // glTF 2.0 decoding foundation. GFBS-glTF-derived importer code converts JglTF models
    // into Combatant-owned immutable asset contracts; no JglTF renderer is used.
    bundledLibrary "de.javagl:jgltf-model:2.0.4"
    bundledLibrary "de.javagl:jgltf-impl-v1:2.0.4"
    bundledLibrary "de.javagl:jgltf-impl-v2:2.0.4"
    bundledLibrary "com.fasterxml.jackson.core:jackson-annotations:2.13.4"
    bundledLibrary "com.fasterxml.jackson.core:jackson-core:2.13.4"
    bundledLibrary "com.fasterxml.jackson.core:jackson-databind:2.13.4.2"

    // Linux-only MPRIS backend dependencies. Kept in a separate bundle so slim
    // distributions can remove the complete transitive payload safely.
    linuxBundledLibrary "com.github.hypfvieh:dbus-java-core:4.3.1"
    linuxBundledLibrary "com.github.hypfvieh:dbus-java-transport-native-unixsocket:4.3.1"

    // Provided by Minecraft runtime; keep it out of the bundled jar.
    compileOnly 'com.google.code.gson:gson:2.10.1'

    // Provided by Minecraft/Fabric runtime; do not shade it into the mod jar.
    compileOnly 'org.slf4j:slf4j-api:2.0.17'

    // Javet core only. Native V8 binaries are copied into resources/javet/natives.
    bundledLibrary "com.caoccao.javet:javet:${javetVersion}"
    testImplementation "com.caoccao.javet:javet:${javetVersion}"

    // Javet in minimal V8 mode only: no Node runtime. The canonical remap jar
    // stays universal; release slim artifacts retain only their target native.
    javetNativeBundle "com.caoccao.javet:javet-v8-windows-x86_64:${javetVersion}"
    javetNativeBundle "com.caoccao.javet:javet-v8-linux-x86_64:${javetVersion}"
    javetNativeBundle "com.caoccao.javet:javet-v8-linux-arm64:${javetVersion}"
    javetNativeBundle "com.caoccao.javet:javet-v8-android:${javetVersion}@aar"
    javetNativeBundle "com.caoccao.javet:javet-v8-macos-x86_64:${javetVersion}"
    javetNativeBundle "com.caoccao.javet:javet-v8-macos-arm64:${javetVersion}"

}

tasks.named('test') {
