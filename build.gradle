def resolveUiContractSource = { roots, relativePath, fallbackPath ->
    File resolved = roots.collect { new File(it, relativePath) }.find { it.isFile() }
    resolved != null ? resolved : file(fallbackPath)
}

tasks.register("verifyUiApiContract") {
    group = "verification"
    description = "Verifies the canonical Combatant UI authoring contract against Java and TypeScript surfaces."

    inputs.files(
            file("src/main/resources/assets/combatant/ui/api/ui.contract.json"),
            file("src/main/resources/assets/combatant/ui/api/ui.d.ts"),
            file("src/main/java/combatant/client/render/engine/renderer/ui/runtime/core/UiNodeType.java"),
            file("resources/assets/combatant/ui/api/ui.contract.json"),
            file("resources/assets/combatant/ui/api/ui.d.ts"),
            file("java/combatant/client/render/engine/renderer/ui/runtime/core/UiNodeType.java")
    )

    doLast {
        File contractFile = resolveUiContractSource(
                sourceSets.main.resources.srcDirs,
                "assets/combatant/ui/api/ui.contract.json",
                "resources/assets/combatant/ui/api/ui.contract.json"
        )
        File declarationsFile = resolveUiContractSource(
                sourceSets.main.resources.srcDirs,
                "assets/combatant/ui/api/ui.d.ts",
                "resources/assets/combatant/ui/api/ui.d.ts"
        )
        File nodeTypeFile = resolveUiContractSource(
                sourceSets.main.java.srcDirs,
                "combatant/client/render/engine/renderer/ui/runtime/core/UiNodeType.java",
                "java/combatant/client/render/engine/renderer/ui/runtime/core/UiNodeType.java"
        )

        [contractFile, declarationsFile, nodeTypeFile].each { candidate ->
            if (!candidate.isFile()) {
                throw new GradleException("UI contract verification input is missing: ${candidate}")
            }
        }

        def contract = new groovy.json.JsonSlurper().parse(contractFile)
        def rawNodeTypes = (contract.nodeTypes ?: []).collect { String.valueOf(it) }
        def expectedNodeTypes = new LinkedHashSet(rawNodeTypes)
        if (expectedNodeTypes.isEmpty()) {
            throw new GradleException("ui.contract.json must declare at least one node type.")
        }
        if (expectedNodeTypes.size() != rawNodeTypes.size()) {
            throw new GradleException("ui.contract.json contains duplicate nodeTypes.")
        }

        String enumSource = nodeTypeFile.getText("UTF-8")
        def enumMatcher = enumSource =~ /(?s)public\s+enum\s+UiNodeType\s*\{(.*)\}\s*$/
        if (!enumMatcher.find()) {
            throw new GradleException("Could not parse UiNodeType enum for UI contract verification.")
        }
        def enumNames = new LinkedHashSet()
        (enumMatcher.group(1) =~ /(?m)^\s*([A-Z][A-Z0-9_]*)\s*,?\s*$/).each { match ->
            enumNames.add(match[1].toLowerCase(java.util.Locale.ROOT))
        }
        if (enumNames != expectedNodeTypes) {
            def missingInJava = new LinkedHashSet(expectedNodeTypes)
            missingInJava.removeAll(enumNames)
            def missingInContract = new LinkedHashSet(enumNames)
            missingInContract.removeAll(expectedNodeTypes)
            throw new GradleException(
                    "UI node-type contract mismatch. Missing in UiNodeType=${missingInJava}, "
                            + "missing in ui.contract.json=${missingInContract}"
            )
        }

        String declarations = declarationsFile.getText("UTF-8")
        def nodeTypeMatcher = declarations =~ /(?s)export\s+type\s+UiNodeType\s*=\s*(.*?);/
        if (!nodeTypeMatcher.find()) {
            throw new GradleException("Could not parse UiNodeType from ui.d.ts.")
        }
        def declarationNodeTypes = new LinkedHashSet()
        (nodeTypeMatcher.group(1) =~ /"([^"]+)"/).each { match -> declarationNodeTypes.add(match[1]) }
        if (declarationNodeTypes != expectedNodeTypes) {
            def missingInTypes = new LinkedHashSet(expectedNodeTypes)
            missingInTypes.removeAll(declarationNodeTypes)
            def extraInTypes = new LinkedHashSet(declarationNodeTypes)
            extraInTypes.removeAll(expectedNodeTypes)
            throw new GradleException(
                    "UI TypeScript node-type contract mismatch. Missing=${missingInTypes}, extra=${extraInTypes}"
            )
        }

        def styleMatcher = declarations =~ /(?s)export\s+type\s+UiInlineStyle\s*=\s*\{(.*?)\r?\n\};/
        if (!styleMatcher.find()) {
            throw new GradleException("Could not parse UiInlineStyle from ui.d.ts.")
        }
        def declarationStyleKeys = new LinkedHashSet()
        (styleMatcher.group(1) =~ /(?m)^\s{2}([A-Za-z_$][A-Za-z0-9_$]*)\?:/).each { match ->
            declarationStyleKeys.add(match[1])
        }
        def rawStyleKeys = (contract.styleKeys ?: []).collect { String.valueOf(it) }
        def expectedStyleKeys = new LinkedHashSet(rawStyleKeys)
        if (expectedStyleKeys.size() != rawStyleKeys.size()) {
            throw new GradleException("ui.contract.json contains duplicate styleKeys.")
        }
        if (declarationStyleKeys != expectedStyleKeys) {
            def missingInTypes = new LinkedHashSet(expectedStyleKeys)
            missingInTypes.removeAll(declarationStyleKeys)
            def extraInTypes = new LinkedHashSet(declarationStyleKeys)
            extraInTypes.removeAll(expectedStyleKeys)
            throw new GradleException(
                    "UI TypeScript style-key contract mismatch. Missing=${missingInTypes}, extra=${extraInTypes}"
            )
        }

        (contract.promotedStyles ?: [:]).each { sourceKey, targetKey ->
            if (!expectedStyleKeys.contains(String.valueOf(targetKey))) {
                throw new GradleException(
                        "UI promoted style '${sourceKey}' targets unknown style key '${targetKey}'."
                )
            }
        }
        (contract.styleValues ?: [:]).each { styleKey, values ->
            if (!expectedStyleKeys.contains(String.valueOf(styleKey))
                    && !(contract.promotedStyles ?: [:]).containsKey(styleKey)) {
                throw new GradleException("UI styleValues declares unknown style key '${styleKey}'.")
            }
            if (!(values instanceof Collection) || values.isEmpty()) {
                throw new GradleException("UI styleValues['${styleKey}'] must be a non-empty array.")
            }
        }
    }
}

tasks.register("verifyUniformCodegen", Exec) {
    group = "verification"
    description = "Checks GLSL std140/std430 packing, arrays, matrix strides and malformed layouts."
    inputs.file(file("tools/uniform-codegen/UniformCodegen.java"))
    commandLine "${System.getProperty('java.home')}/bin/java",
            file("tools/uniform-codegen/UniformCodegen.java"), "test"
}

tasks.register("verifyGeneratedUniformPacking", Exec) {
    group = "verification"
    description = "Compiles generated std140/std430 classes and verifies actual byte-level layouts."
    dependsOn tasks.named("verifyUniformCodegen")
    inputs.files(file("tools/uniform-codegen/CodegenSmoke.java"),
            file("tools/uniform-codegen/UniformCodegen.java"),
            file("src/main/java/combatant/client/render/engine/uniform/ShaderUniformBindings.java"),
            file("src/main/java/combatant/client/render/engine/rhi/shader/Std430Type.java"),
            file("src/main/java/combatant/client/render/engine/rhi/shader/Std430StructLayout.java"))
    commandLine "${System.getProperty('java.home')}/bin/java",
            file("tools/uniform-codegen/CodegenSmoke.java")
}

tasks.register("verifyUniformSourceBoundary") {
    group = "verification"
    description = "Rejects direct main-source dependencies on verification-only generated uniform classes."
    inputs.dir(file("src/main/java"))
    doLast {
        def offenders = fileTree("src/main/java") {
            include "**/*.java"
        }.files.findAll { it.getText("UTF-8").contains("combatant.client.render.engine.uniform.generated") }
        if (!offenders.isEmpty()) {
            throw new GradleException("Main sources import generated uniform classes: " +
                    offenders.collect { project.relativePath(it) }.join(", "))
        }
    }
}

tasks.register("generateUniformBindings", Exec) {
    group = "build"
    description = "Discovers GLSL UBO/SSBO declarations and generates runtime layout metadata."
    inputs.file(file("tools/uniform-codegen/UniformCodegen.java"))
    inputs.files(fileTree("src/main/resources/assets/combatant/shaders") {
        include "**/*.vert", "**/*.frag", "**/*.geom", "**/*.comp", "**/*.glsl"
    })
    outputs.dir(generatedUniformResources)
    commandLine "${System.getProperty('java.home')}/bin/java",
            file("tools/uniform-codegen/UniformCodegen.java"), "discover",
            file("src/main/resources/assets/combatant/shaders"),
            generatedUniformResources.get().asFile
}

tasks.register("verifyUniformBindingContracts", Exec) {
    group = "verification"
    description = "Checks Java uniform writers and blocks against every discovered GLSL layout before compilation."
    dependsOn tasks.named("generateUniformBindings")
    inputs.file(file("tools/uniform-codegen/UniformCodegen.java"))
    inputs.dir(file("src/main/java"))
    inputs.dir(generatedUniformResources)
    commandLine "${System.getProperty('java.home')}/bin/java",
            file("tools/uniform-codegen/UniformCodegen.java"), "verify",
            generatedUniformResources.get().file("combatant/uniform-bindings-v3.tsv").asFile,
            file("src/main/java")
}

tasks.named("compileJava") {
    dependsOn tasks.named("verifyUniformBindingContracts")
}

tasks.named("compileJava") {
    dependsOn tasks.named("verifyUiApiContract")
}

def validateMixinStructure = tasks.register("validateMixinStructure") {
    group = "verification"
    description = "Validates Mixin config membership, target ownership and static handlers."
    def roots = [
            [source: file("src/main/java"), config: file("src/main/resources/combatant.mixins.json")],
            [source: file("src/dev/java"), config: file("src/dev/resources/combatant-dev.mixins.json")]
    ]
    inputs.files(roots.collect { it.config })
    inputs.files(roots.collect { fileTree(it.source) { include "**/*.java" } })

    doLast {
        def failures = []
        def allSources = [:]
        def configuredByRoot = [:]

        roots.each { root ->
            def parsed = new JsonSlurper().parse(root.config)
            def prefix = parsed.package + "."
            def entries = []
            [parsed.mixins, parsed.client, parsed.server].findAll { it instanceof Collection }.each {
                entries.addAll(it.collect { name -> prefix + name })
            }
            def duplicateEntries = entries.groupBy { it }.findAll { key, values -> values.size() > 1 }.keySet()
            duplicateEntries.each { failures.add("${root.config}: duplicate Mixin entry ${it}") }
            configuredByRoot[root.source.absolutePath] = entries as Set

            fileTree(root.source) { include "**/*.java" }.files.each { source ->
                def text = source.getText("UTF-8")
                if (!(text =~ /@Mixin\s*\(/).find()) return
                def packageMatch = text =~ /(?m)^package\s+([\w.]+)\s*;/
                def typeMatch = text =~ /(?m)^public\s+(?:abstract\s+|final\s+)?(class|interface)\s+(\w+)/
                if (!packageMatch.find() || !typeMatch.find()) {
                    failures.add("${source}: cannot resolve Mixin class declaration")
                    return
                }
                def mixinClass = packageMatch.group(1) + "." + typeMatch.group(2)
                def target = null
                def classTarget = text =~ /@Mixin\s*\(\s*(?:value\s*=\s*)?(?:\{\s*)?([\w.$]+)\.class/
                if (classTarget.find()) {
                    def written = classTarget.group(1)
                    def first = written.tokenize('.')[0]
                    def importMatch = text =~ /(?m)^import\s+([\w.$]+\.${java.util.regex.Pattern.quote(first)})\s*;/
                    target = importMatch.find()
                            ? importMatch.group(1) + written.substring(first.length())
                            : written
                } else {
                    def stringTarget = text =~ /@Mixin\s*\([^)]*targets\s*=\s*"([^"]+)"/
                    if (stringTarget.find()) target = stringTarget.group(1)
                }
                if (target == null) failures.add("${source}: cannot resolve @Mixin target")
                def injectionOwner = (text =~ /@(Inject|Redirect|ModifyVariable|ModifyArg|ModifyArgs|ModifyConstant|WrapOperation|WrapMethod|Overwrite)\b/).find()
                allSources[mixinClass] = [file: source, target: target, kind: typeMatch.group(1), text: text,
                                          injectionOwner: injectionOwner, root: root.source.absolutePath]
            }
        }

        allSources.each { mixinClass, source ->
            if (!configuredByRoot[source.root].contains(mixinClass)) {
                failures.add("${source.file}: Mixin ${mixinClass} is absent from its mixin config")
            }
        }
        configuredByRoot.each { rootPath, configured ->
            configured.each { mixinClass ->
                if (!allSources.containsKey(mixinClass)) {
                    failures.add("Mixin config references missing class ${mixinClass}")
                }
            }
        }

        def mainConfigured = configuredByRoot[file("src/main/java").absolutePath]
        def devConfigured = configuredByRoot[file("src/dev/java").absolutePath]
        def activeMixins = (mainConfigured + devConfigured).findAll { allSources.containsKey(it) }
        configuredByRoot.each { rootPath, configured ->
            def injectionMixins = configured.findAll {
                allSources.containsKey(it) && allSources[it].injectionOwner
            }
            injectionMixins.groupBy { allSources[it].target }
                    .findAll { target, owners -> target != null && owners.size() > 1 }
                    .each { target, owners ->
                        failures.add("Mixin config for ${rootPath} gives target ${target} multiple owners: ${owners.sort().join(', ')}")
                    }
        }

        def classpath = sourceSets.dev.compileClasspath.files.findAll { it.exists() }
        def zipFiles = [:]
        def accessCache = [:]
        def targetAccess = { String target ->
            if (accessCache.containsKey(target)) return accessCache[target]
            String entryName = target.replace('.', '/') + ".class"
            Integer access = null
            for (File path : classpath) {
                byte[] bytes = null
                if (path.isDirectory()) {
                    File candidate = new File(path, entryName)
                    if (candidate.isFile()) bytes = candidate.bytes
                } else if (path.name.endsWith(".jar")) {
                    def zip = zipFiles.computeIfAbsent(path) { new java.util.zip.ZipFile(path) }
                    def entry = zip.getEntry(entryName)
                    if (entry != null) bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                }
                if (bytes != null) {
                    access = new ClassReader(bytes).access
                    break
                }
            }
            accessCache[target] = access
            return access
        }

        try {
            activeMixins.each { mixinClass ->
                def source = allSources[mixinClass]
                Integer access = source.target != null ? targetAccess(source.target as String) : null
                if (access != null && (access & Opcodes.ACC_INTERFACE) != 0 && source.kind == "class") {
                    failures.add("${source.file}: class Mixin ${mixinClass} targets interface ${source.target}")
                }

                def injection = source.text =~ /(?s)@(Inject|Redirect|ModifyVariable|ModifyArg|ModifyArgs|ModifyConstant|WrapOperation|WrapMethod)\s*\((.*?)\)\s*(?:\r?\n\s*@\w+(?:\([^)]*\))?\s*)*(?:private|protected|public)\s+(static\s+)?[\w<>?,.\[\] @$]+\s+\w+\s*\(/
                while (injection.find()) {
                    def annotation = injection.group(2)
                    def methodMatch = annotation =~ /method\s*=\s*"([^"]+)"/
                    if (!methodMatch.find() || source.target == null) continue
                    def targetMethod = methodMatch.group(1).replaceFirst(/\(.*$/, "")
                    if (targetMethod == "<init>" || targetMethod == "<clinit>") continue
                    def methodAccesses = []
                    String entryName = source.target.replace('.', '/') + ".class"
                    for (File path : classpath) {
                        byte[] bytes = null
                        if (path.isDirectory()) {
                            File candidate = new File(path, entryName)
                            if (candidate.isFile()) bytes = candidate.bytes
                        } else if (path.name.endsWith(".jar")) {
                            def zip = zipFiles.computeIfAbsent(path) { new java.util.zip.ZipFile(path) }
                            def entry = zip.getEntry(entryName)
                            if (entry != null) bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                        }
                        if (bytes != null) {
                            new ClassReader(bytes).accept(new org.objectweb.asm.ClassVisitor(Opcodes.ASM9) {
                                @Override
                                org.objectweb.asm.MethodVisitor visitMethod(int methodAccess, String name, String descriptor,
                                                                           String signature, String[] exceptions) {
                                    if (name == targetMethod) methodAccesses.add(methodAccess)
                                    return null
                                }
                            }, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                            break
                        }
                    }
                    if (methodAccesses && methodAccesses.every { (it & Opcodes.ACC_STATIC) != 0 }
                            && injection.group(3) == null) {
                        failures.add("${source.file}: handler for static target method ${source.target}.${targetMethod} must be static")
                    }
                }
            }
        } finally {
            zipFiles.values().each { it.close() }
        }

        if (!failures.isEmpty()) {
            failures.sort().each { logger.error("[Mixin validation] ${it}") }
            throw new GradleException("Mixin structure validation failed with ${failures.size()} error(s)")
        }
    }
}

if (mixinValidationEnabled.get()) {
    tasks.named("compileJava") {
        dependsOn validateMixinStructure
    }
    tasks.named("compileDevJava") {
        dependsOn validateMixinStructure
    }
}

def validateMixinSignatures = tasks.register("validateMixinSignatures") {
    group = "verification"
    description = "Validates compiled Mixin handlers and instruction targets against target bytecode."
    dependsOn tasks.named("compileJava"), tasks.named("compileDevJava")
    inputs.files(sourceSets.main.output.classesDirs, sourceSets.dev.output.classesDirs)
    inputs.files(sourceSets.dev.compileClasspath)
    inputs.files(file("src/main/resources/combatant.mixins.json"), file("src/dev/resources/combatant-dev.mixins.json"))

    doLast {
        def failures = []
        def configured = []
        [file("src/main/resources/combatant.mixins.json"), file("src/dev/resources/combatant-dev.mixins.json")].each { config ->
            def parsed = new JsonSlurper().parse(config)
            def prefix = parsed.package + "."
            [parsed.mixins, parsed.client, parsed.server].findAll { it instanceof Collection }.each { entries ->
                configured.addAll(entries.collect { prefix + it })
            }
        }

        def outputDirs = (sourceSets.main.output.classesDirs.files + sourceSets.dev.output.classesDirs.files)
                .findAll { it.exists() }
        def classpath = (sourceSets.dev.compileClasspath.files + outputDirs).findAll { it.exists() }
        def zipFiles = [:]
        def classCache = [:]
        def readClass = { String className ->
            if (classCache.containsKey(className)) return classCache[className]
            String entryName = className.replace('.', '/') + ".class"
            byte[] bytes = null
            for (File path : classpath) {
                if (path.isDirectory()) {
                    File candidate = new File(path, entryName)
                    if (candidate.isFile()) bytes = candidate.bytes
                } else if (path.name.endsWith(".jar")) {
                    def zip = zipFiles.computeIfAbsent(path) { new java.util.zip.ZipFile(path) }
                    def entry = zip.getEntry(entryName)
                    if (entry != null) bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                }
                if (bytes != null) break
            }
            ClassNode node = null
            if (bytes != null) {
                node = new ClassNode(Opcodes.ASM9)
                new ClassReader(bytes).accept(node, ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
            }
            classCache[className] = node
            return node
        }
        def annotationValue = { AnnotationNode annotation, String key ->
            if (annotation?.values == null) return null
            for (int index = 0; index < annotation.values.size(); index += 2) {
                if (annotation.values[index] == key) return annotation.values[index + 1]
            }
            return null
        }
        def allAnnotations = { node ->
            def annotations = []
            if (node.visibleAnnotations != null) annotations.addAll(node.visibleAnnotations)
            if (node.invisibleAnnotations != null) annotations.addAll(node.invisibleAnnotations)
            return annotations
        }

        try {
            configured.unique().each { mixinClass ->
                ClassNode mixin = readClass(mixinClass)
                if (mixin == null) {
                    failures.add("Cannot read compiled Mixin class ${mixinClass}")
                    return
                }
                AnnotationNode mixinAnnotation = allAnnotations(mixin).find {
                    it.desc == "Lorg/spongepowered/asm/mixin/Mixin;"
                }
                if (mixinAnnotation == null) return

                def targets = []
                def typedTargets = annotationValue(mixinAnnotation, "value")
                if (typedTargets instanceof Collection) {
                    typedTargets.each { value ->
                        if (value instanceof Type) targets.add(value.className)
                    }
                }
                def stringTargets = annotationValue(mixinAnnotation, "targets")
                if (stringTargets instanceof Collection) targets.addAll(stringTargets)

                if (targets.size() > 1) {
                    (mixin.fields + mixin.methods).each { member ->
                        AnnotationNode shadow = allAnnotations(member).find {
                            it.desc == "Lorg/spongepowered/asm/mixin/Shadow;"
                        }
                        if (shadow != null && annotationValue(shadow, "remap") != false) {
                            failures.add("${mixinClass}.${member.name}${member instanceof MethodNode ? member.desc : ':' + member.desc}: multi-target @Shadow must declare remap = false")
                        }
                    }
                }

                mixin.methods.each { handler ->
                    def handlerAnnotations = allAnnotations(handler)
                    def injectorDescriptors = [
                            "Lorg/spongepowered/asm/mixin/injection/Inject;",
                            "Lorg/spongepowered/asm/mixin/injection/Redirect;",
                            "Lorg/spongepowered/asm/mixin/injection/ModifyVariable;",
                            "Lorg/spongepowered/asm/mixin/injection/ModifyArg;",
                            "Lorg/spongepowered/asm/mixin/injection/ModifyArgs;",
                            "Lorg/spongepowered/asm/mixin/injection/ModifyConstant;",
                            "Lcom/llamalad7/mixinextras/injector/ModifyExpressionValue;",
                            "Lcom/llamalad7/mixinextras/injector/ModifyReturnValue;",
                            "Lcom/llamalad7/mixinextras/injector/wrapmethod/WrapMethod;",
                            "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;"
                    ] as Set
                    handlerAnnotations.findAll { injectorDescriptors.contains(it.desc) }.each { injector ->
                        if ((handler.access & Opcodes.ACC_PRIVATE) == 0) {
                            failures.add("${mixinClass}.${handler.name}${handler.desc}: injector handler must be private")
                        }
                        def injectorSelectors = annotationValue(injector, "method")
                        if (injectorSelectors instanceof String) injectorSelectors = [injectorSelectors]
                        if (!(injectorSelectors instanceof Collection)) return
                        targets.each { targetClass ->
                            ClassNode target = readClass(targetClass as String)
                            if (target == null) return
                            injectorSelectors.each { rawSelector ->
                                String selector = rawSelector as String
                                int descriptorStart = selector.indexOf('(')
                                String targetName = descriptorStart >= 0 ? selector.substring(0, descriptorStart) : selector
                                String explicitDescriptor = descriptorStart >= 0 ? selector.substring(descriptorStart) : null
                                if (targetName.contains(';')) targetName = targetName.substring(targetName.lastIndexOf(';') + 1)
                                String namePattern = targetName.split("\\*", -1)
                                        .collect { java.util.regex.Pattern.quote(it) }
                                        .join(".*")
                                boolean exists = target.methods.any { method ->
                                    method.name ==~ namePattern && (explicitDescriptor == null || method.desc == explicitDescriptor)
                                }
                                if (!exists) {
                                    failures.add("${mixinClass}.${handler.name}${handler.desc}: injector target ${targetClass}.${selector} does not exist")
                                    return
                                }

                                def atValue = annotationValue(injector, "at")
                                def atAnnotations = atValue instanceof Collection ? atValue : atValue instanceof AnnotationNode ? [atValue] : []
                                atAnnotations.each { AnnotationNode at ->
                                    String atKind = annotationValue(at, "value") as String
                                    String instructionTarget = annotationValue(at, "target") as String
                                    if (instructionTarget == null || instructionTarget.isEmpty()) return
                                    def member = instructionTarget =~ /^L([^;]+);([^(:]+)(\(.*|:.*)$/
                                    if (!member.matches()) return
                                    String owner = member.group(1)
                                    String memberName = member.group(2)
                                    String memberDescriptor = member.group(3)
                                    def selectedTargetMethods = target.methods.findAll { method ->
                                        method.name ==~ namePattern && (explicitDescriptor == null || method.desc == explicitDescriptor)
                                    }
                                    def matchingInstructions = []
                                    selectedTargetMethods.each { targetMethod ->
                                        for (def instruction = targetMethod.instructions?.first; instruction != null; instruction = instruction.next) {
                                            if (memberDescriptor.startsWith("(")
                                                    && instruction instanceof org.objectweb.asm.tree.MethodInsnNode
                                                    && instruction.owner == owner
                                                    && instruction.name == memberName
                                                    && instruction.desc == memberDescriptor) {
                                                matchingInstructions.add([targetMethod, instruction])
                                            }
                                            if (memberDescriptor.startsWith(":")
                                                    && instruction instanceof org.objectweb.asm.tree.FieldInsnNode
                                                    && instruction.owner == owner
                                                    && instruction.name == memberName
                                                    && instruction.desc == memberDescriptor.substring(1)) {
                                                matchingInstructions.add([targetMethod, instruction])
                                            }
                                        }
                                    }
                                    if (atKind == "INVOKE_STRING") {
                                        def atArgs = annotationValue(at, "args")
                                        if (atArgs instanceof String) atArgs = [atArgs]
                                        String requiredConstant = atArgs instanceof Collection
                                                ? atArgs.find { it instanceof String && it.startsWith("ldc=") }
                                                : null
                                        if (requiredConstant != null) {
                                            requiredConstant = requiredConstant.substring("ldc=".length())
                                            matchingInstructions = matchingInstructions.findAll { match ->
                                                def previous = match[1].previous
                                                while (previous instanceof org.objectweb.asm.tree.LabelNode
                                                        || previous instanceof org.objectweb.asm.tree.LineNumberNode
                                                        || previous instanceof org.objectweb.asm.tree.FrameNode) {
                                                    previous = previous.previous
                                                }
                                                previous instanceof org.objectweb.asm.tree.LdcInsnNode
                                                        && previous.cst == requiredConstant
                                            }
                                        }
                                    }
                                    if (matchingInstructions.isEmpty()) {
                                        failures.add("${mixinClass}.${handler.name}${handler.desc}: @At(${atKind}) target ${instructionTarget} is absent from ${targetClass}.${selector}")
                                        return
                                    }
                                    if (injector.desc == "Lorg/spongepowered/asm/mixin/injection/Redirect;"
                                            && memberDescriptor.startsWith("(")) {
                                        matchingInstructions.each { match ->
                                            def targetMethod = match[0]
                                            def instruction = match[1] as org.objectweb.asm.tree.MethodInsnNode
                                            def redirectArguments = Type.getArgumentTypes(instruction.desc).toList()
                                            if (instruction.opcode != Opcodes.INVOKESTATIC) {
                                                redirectArguments.add(0, Type.getObjectType(instruction.owner))
                                            }
                                            Type redirectReturn = Type.getReturnType(instruction.desc)
                                            String directDescriptor = Type.getMethodDescriptor(
                                                    redirectReturn, redirectArguments as Type[])
                                            def capturedArguments = new ArrayList<Type>(redirectArguments)
                                            capturedArguments.addAll(Type.getArgumentTypes(targetMethod.desc).toList())
                                            String capturedDescriptor = Type.getMethodDescriptor(
                                                    redirectReturn, capturedArguments as Type[])
                                            if (handler.desc != directDescriptor && handler.desc != capturedDescriptor) {
                                                failures.add("${mixinClass}.${handler.name}${handler.desc}: @Redirect signature must be ${directDescriptor} or ${capturedDescriptor}")
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    AnnotationNode inject = handlerAnnotations.find {
                        it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
                    }
                    if (inject == null) return
                    def selectors = annotationValue(inject, "method")
                    if (selectors instanceof String) selectors = [selectors]
                    if (!(selectors instanceof Collection) || selectors.isEmpty()) {
                        failures.add("${mixinClass}.${handler.name}${handler.desc}: @Inject has no method selector")
                        return
                    }

                    Type[] handlerArguments = Type.getArgumentTypes(handler.desc)
                    int callbackIndex = -1
                    for (int index = 0; index < handlerArguments.length; index++) {
                        String internalName = handlerArguments[index].sort == Type.OBJECT
                                ? handlerArguments[index].internalName : ""
                        if (internalName == "org/spongepowered/asm/mixin/injection/callback/CallbackInfo"
                                || internalName == "org/spongepowered/asm/mixin/injection/callback/CallbackInfoReturnable") {
                            callbackIndex = index
                            break
                        }
                    }
                    if (callbackIndex < 0) {
                        failures.add("${mixinClass}.${handler.name}${handler.desc}: @Inject handler has no CallbackInfo parameter")
                        return
                    }
                    Type[] capturedArguments = handlerArguments.take(callbackIndex) as Type[]

                    targets.each { targetClass ->
                        ClassNode target = readClass(targetClass as String)
                        if (target == null) {
                            return
                        }
                        selectors.each { rawSelector ->
                            String selector = rawSelector as String
                            int descriptorStart = selector.indexOf('(')
                            String targetName = descriptorStart >= 0 ? selector.substring(0, descriptorStart) : selector
                            String explicitDescriptor = descriptorStart >= 0 ? selector.substring(descriptorStart) : null
                            if (targetName.contains(';')) targetName = targetName.substring(targetName.lastIndexOf(';') + 1)
                            String namePattern = targetName.split("\\*", -1)
                                    .collect { java.util.regex.Pattern.quote(it) }
                                    .join(".*")
                            def candidates = target.methods.findAll { method ->
                                method.name ==~ namePattern && (explicitDescriptor == null || method.desc == explicitDescriptor)
                            }
                            if (candidates.isEmpty()) {
                                failures.add("${mixinClass}.${handler.name}${handler.desc}: target ${targetClass}.${selector} does not exist")
                                return
                            }

                            def nonMatching = candidates.findAll { targetMethod ->
                                Type[] targetArguments = Type.getArgumentTypes(targetMethod.desc)
                                boolean argumentsMatch = capturedArguments.length == 0 ||
                                        (capturedArguments.length == targetArguments.length
                                                && capturedArguments.indices.every { argumentIndex ->
                                                    boolean coerced = handler.invisibleParameterAnnotations != null
                                                            && argumentIndex < handler.invisibleParameterAnnotations.length
                                                            && handler.invisibleParameterAnnotations[argumentIndex]?.any {
                                                                it.desc == "Lorg/spongepowered/asm/mixin/injection/Coerce;"
                                                            }
                                                    coerced = coerced || (handler.visibleParameterAnnotations != null
                                                            && argumentIndex < handler.visibleParameterAnnotations.length
                                                            && handler.visibleParameterAnnotations[argumentIndex]?.any {
                                                                it.desc == "Lorg/spongepowered/asm/mixin/injection/Coerce;"
                                                            })
                                                    coerced || capturedArguments[argumentIndex] == targetArguments[argumentIndex]
                                                })
                                boolean callbackMatches = Type.getReturnType(targetMethod.desc).sort == Type.VOID
                                        ? handlerArguments[callbackIndex].internalName == "org/spongepowered/asm/mixin/injection/callback/CallbackInfo"
                                        : handlerArguments[callbackIndex].internalName == "org/spongepowered/asm/mixin/injection/callback/CallbackInfoReturnable"
                                boolean staticMatches = (targetMethod.access & Opcodes.ACC_STATIC) == 0 ||
                                        (handler.access & Opcodes.ACC_STATIC) != 0
                                return !(argumentsMatch && callbackMatches && staticMatches)
                            }
                            if (!nonMatching.isEmpty()) {
                                def expected = nonMatching.collect { it.name + it.desc }.join(" and ")
                                failures.add("${mixinClass}.${handler.name}${handler.desc}: handler signature does not match ${targetClass} ${expected}")
                            }
                        }
                    }
                }
            }
        } finally {
            zipFiles.values().each { it.close() }
        }

        if (!failures.isEmpty()) {
            failures.unique().sort().each { logger.error("[Mixin signature validation] ${it}") }
            throw new GradleException("Mixin signature validation failed with ${failures.unique().size()} error(s)")
        }
    }
}

def validateMixins = tasks.register("validateMixins", JavaCompile) {
    group = "verification"
    description = "Validates Mixin targets and hooks with the SpongePowered annotation processor."
    dependsOn validateMixinStructure, validateMixinSignatures
    source = sourceSets.main.java + sourceSets.dev.java
    classpath = sourceSets.dev.compileClasspath
    destinationDirectory = layout.buildDirectory.dir("mixin-validation/classes")
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    options.annotationProcessorPath = configurations.mixinValidationProcessor
    options.incremental = false
    options.compilerArgs.addAll([
            "-proc:only",
            "-Xmaxerrs", "1000",
            "-Xmaxwarns", "1000",
            "-AshowMessageTypes=true",
            "-AMSG_NO_OBFDATA_FOR_ACCESSOR=note",
            "-AMSG_NO_OBFDATA_FOR_CLASS=note",
            "-AMSG_NO_OBFDATA_FOR_TARGET=note",
            "-AMSG_NO_OBFDATA_FOR_CTOR=note",
            "-AMSG_NO_OBFDATA_FOR_OVERWRITE=note",
            "-AMSG_NO_OBFDATA_FOR_STATIC_OVERWRITE=note",
            "-AMSG_NO_OBFDATA_FOR_FIELD=note",
            "-AMSG_NO_OBFDATA_FOR_METHOD=note",
            "-AMSG_NO_OBFDATA_FOR_SHADOW=note",
            "-AMSG_NO_OBFDATA_FOR_SIMULATED_SHADOW=note",
            "-AMSG_NO_OBFDATA_FOR_SOFT_IMPLEMENTS=note",
            "-AMSG_TARGET_ELEMENT_NOT_FOUND=error",
            "-AMSG_MISSING_INJECTOR_DESC_SINGLETARGET=error"
    ])
}

tasks.named("check") {
    if (mixinValidationEnabled.get()) {
        dependsOn validateMixins
    }
}

tasks.named("processResources") {
    dependsOn tasks.named("verifyUiApiContract"), tasks.named("generateUniformBindings")
}

// Packaging is intentionally independent from verification. Tests remain available through
// the explicit `test` / `check` tasks, but the normal `build` path only assembles artifacts.
tasks.named('build') {
    setDependsOn([tasks.named('assemble')])
}

tasks.register("validateIrisPatches", JavaExec) {
    group = "verification"
    description = "Compiles bundled Iris patch manifests against a shaderpack zip without modifying it."
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "combatant.client.render.iris.patch.ShaderPatchCompilerCli"
    doFirst {
        if (!project.hasProperty("shaderpack")) {
            throw new GradleException("Pass -Pshaderpack=<path-to-shaderpack.zip>")
        }
        args project.property("shaderpack")
    }
}

tasks.register("generateSvgMsdf", Exec) {
    group = "render assets"
    description = "Generates MTSDF texture assets for tintable SVG icons."
    dependsOn tasks.named("compileSvgMsdfToolJava")

    def inputDir = file("src/main/resources/assets/combatant/svg")
    def outputDir = svgMsdfGeneratedResources.map { it.dir("assets/combatant/svg/msdf") }
    def script = file("tools/msdf/GenerateSvgMsdf.ps1")
    def preprocessorClasspath = sourceSets.svgMsdfTool.output.classesDirs.asPath +
            File.pathSeparator + sourceSets.main.output.classesDirs.asPath +
            File.pathSeparator + sourceSets.main.compileClasspath.asPath
    def generatorJava = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    inputs.files(fileTree(inputDir) {
        include "**/*.svg"
        exclude "msdf/**"
    })
    inputs.file(script)
    outputs.dir(outputDir)
    onlyIf {
        if (!script.isFile()) {
            logger.warn("SVG MSDF generator missing: ${script}")
            return false
        }
        return true
    }
    doFirst {
        outputDir.get().asFile.mkdirs()
    }
    commandLine "powershell",
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", script.absolutePath,
            "-InputRoot", inputDir.path,
            "-OutRoot", outputDir.get().asFile.path,
            "-PreprocessorClasspath", preprocessorClasspath,
            "-JavaExe", generatorJava.get().executablePath.asFile.absolutePath
}

tasks.register("generateFontMsdf", Exec) {
    group = "render assets"
    description = "Regenerates compact MSDF atlases for bundled icon and symbol fonts."

    def script = file("tools/msdf/GenerateFontMsdf.ps1")
    inputs.files(fileTree("src/main/resources/assets/combatant/font") {
        include "matrix_sans_print.ttf", "icons.ttf", "iconsnur.ttf", "mediaplayer.ttf", "vanilla_symbols.ttf", "weather_icons.ttf"
    })
    inputs.file(script)
    def atlasBases = ["matrix_sans_print", "icons", "iconsnur", "mediaplayer", "vanilla_symbols", "weather_icons"]
    outputs.files(atlasBases.collectMany { base -> [
            file("src/main/resources/assets/combatant/font/msdf/${base}.json"),
            file("src/main/resources/assets/combatant/font/msdf/${base}.png")
    ] })

    commandLine "powershell",
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", script.absolutePath
}


ext.combatantJavetNativeResourcePath = { String path ->
    if (path.startsWith("jni/")) {
        return path.startsWith("jni/arm64-v8a/") && path.endsWith(".so")
                ? "android/" + path.substring("jni/".length()) : null
    }
    return path.tokenize('/').last()
}

tasks.register("unpackJavetNatives", Sync) {
    group = "runtime assets"
    description = "Copies bundled Javet V8 native binaries into generated resources."
    into javetNativeGeneratedResources.map { it.dir("javet/natives") }
    from({ configurations.javetNativeBundle.collect { zipTree(it) } }) {
        include "**/*.dll", "**/*.so", "**/*.dylib"
        eachFile { details ->
            String resourcePath = combatantJavetNativeResourcePath(details.path)
            if (resourcePath == null) details.exclude()
            else details.path = resourcePath
        }
        includeEmptyDirs = false
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("syncJavetNatives", Copy) {
    group = "runtime assets"
    description = "Copies Javet V8 native binaries into src/main/resources/javet/natives for committing/debugging."
    into file("src/main/resources/javet/natives")
    from({ configurations.javetNativeBundle.collect { zipTree(it) } }) {
        include "**/*.dll", "**/*.so", "**/*.dylib"
        eachFile { details ->
            String resourcePath = combatantJavetNativeResourcePath(details.path)
            if (resourcePath == null) details.exclude()
            else details.path = resourcePath
        }
        includeEmptyDirs = false
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn tasks.named("generateSvgMsdf")
    dependsOn tasks.named("unpackJavetNatives")
    from(javetNativeGeneratedResources)
    inputs.property "mod_id", combatantModId
    inputs.property "mod_name", combatantModName
    inputs.property "mod_license", combatantModLicense
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "combatant_dev", combatantDevEnabled.get()
    inputs.property "combatant_vulkan_debug", combatantVulkanDebugEnabled.get()
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "mod_id": combatantModId,
                "mod_name": combatantModName,
                "mod_license": combatantModLicense,
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }

    doLast {
        if (!combatantDevEnabled.get() && !combatantVulkanDebugEnabled.get()) return
        def metadataFile = new File(destinationDir, "fabric.mod.json")
        def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
        def mixins = metadata.mixins instanceof java.util.Collection
                ? new ArrayList(metadata.mixins)
                : new ArrayList()
        if (combatantDevEnabled.get() && !mixins.contains("combatant-dev.mixins.json")) {
            mixins.add("combatant-dev.mixins.json")
        }
        if (!mixins.contains("combatant-vulkan-debug.mixins.json")) {
            if (combatantVulkanDebugEnabled.get()) {
                mixins.add("combatant-vulkan-debug.mixins.json")
            }
        }
        metadata.mixins = mixins
        metadataFile.setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + System.lineSeparator(),
                "UTF-8"
        )
    }
}

tasks.named("processDevResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

