tasks.register("prepareDevUiFonts") {
    group = "development"
    description = "Fetch pinned Roboto faces and the license for the dev UI component gallery."
    outputs.dir(googleMaterialFontRoot)
    doLast {
        def outputDir = googleMaterialFontRoot.get().file("assets/combatant/font").asFile
        outputDir.mkdirs()
        def upstream = "https://raw.githubusercontent.com/googlefonts/roboto-2/v2.138/"
        [
            "roboto_regular.ttf": "src/hinted/Roboto-Regular.ttf",
            "roboto_medium.ttf": "src/hinted/Roboto-Medium.ttf",
            "Roboto-LICENSE.txt": "LICENSE"
        ].each { String filename, String upstreamPath ->
            File targetFile = new File(outputDir, filename)
            if (targetFile.isFile() && targetFile.length() > 1000) return
            File tempFile = new File(outputDir, filename + ".partial")
            try {
                new URL(upstream + upstreamPath).openStream().withCloseable { stream ->
                    tempFile.withOutputStream { output -> output << stream }
                }
                if (tempFile.length() <= 1000) {
                    throw new GradleException("Invalid Roboto asset: ${upstreamPath}")
                }
                if (filename.endsWith(".ttf")) {
                    byte[] signature = new byte[4]
                    tempFile.withInputStream { input -> input.read(signature) }
                    if (!((signature[0] == 0 && signature[1] == 1)
                            || (signature[0] == 79 && signature[1] == 84))) {
                        throw new GradleException("Roboto asset is not a font: ${upstreamPath}")
                    }
                }
                java.nio.file.Files.move(tempFile.toPath(), targetFile.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally {
                tempFile.delete()
            }
        }
    }
}

tasks.named("processDevResources") {
    dependsOn tasks.named("prepareDevUiFonts")
}

tasks.named("processDuplexCourierResources") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", duplexCourierVersion
    inputs.property "minecraft_version", providers.gradleProperty("minecraft_version").get()
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": duplexCourierVersion,
                "minecraft_version": providers.gradleProperty("minecraft_version").get()
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.named("compileJava", JavaCompile) {
    options.compilerArgs.add("-Acombatant.indexName=main")
}

tasks.named("compileDevJava", JavaCompile) {
    options.compilerArgs.add("-Acombatant.indexName=dev")
}

tasks.named("compileVulkanDebugJava", JavaCompile) {
    options.compilerArgs.add("-Acombatant.indexName=vulkanDebug")
}

tasks.named("compileDuplexCourierJava", JavaCompile) {
    options.compilerArgs.add("-proc:none")
}

def duplexCourierJar = tasks.register("duplexCourierJar", Jar) {
    group = "build"
    description = "Assembles the standalone Duplex Courier Fabric mod."
    dependsOn tasks.named("duplexCourierClasses")
    archiveBaseName.set("combatant-duplex-courier")
    archiveVersion.set(duplexCourierVersion)
    archiveClassifier.set("")
    from(sourceSets.duplexCourier.output)
    manifest {
        attributes(
                "Multi-Release": "true",
                "Fabric-Mapping-Namespace": "official"
        )
    }
}

tasks.register("buildDuplexCourier") {
    group = "build"
    description = "Builds only the standalone Duplex Courier mod."
    dependsOn duplexCourierJar
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
   // withSourcesJar()
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
    dependsOn tasks.named("generateSvgMsdf")
    exclude("javet/natives/**")
    exclude("combatant/nativeguard/**")
}

jar {
    manifest {
        attributes("Multi-Release": "true")
    }

    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("THIRD_PARTY_NOTICES.md")
    from("THIRD_PARTY_LICENSES/Noto-OFL-1.1.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from("THIRD_PARTY_LICENSES/Noto-CJK-OFL-1.1.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from("THIRD_PARTY_LICENSES/Iosevka-OFL-1.1.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from("THIRD_PARTY_LICENSES/GFBS-glTF-MIT.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from("THIRD_PARTY_LICENSES/JglTF-MIT.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from("THIRD_PARTY_LICENSES/Jackson-Apache-2.0.txt") {
        into "THIRD_PARTY_LICENSES"
    }
    from {
        [configurations.bundledLibrary, configurations.linuxBundledLibrary]
                .collectMany { configuration -> configuration.collect { it.isDirectory() ? it : zipTree(it) } }
    }
    exclude "com/google/gson/**"
    exclude "org/slf4j/**"
    exclude "META-INF/*.RSA", "META-INF/*.SF", "META-INF/*.DSA"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if (combatantDevEnabled.get()) {
        dependsOn tasks.named("compileDevJava"), tasks.named("processDevResources")
        from(sourceSets.dev.output)
    }
    if (combatantVulkanDebugEnabled.get()) {
        dependsOn tasks.named("compileVulkanDebugJava"), tasks.named("processVulkanDebugResources")
        from(sourceSets.vulkanDebug.output)
    }
}

// Gradle cannot accept an arbitrary global `--dev` flag for the built-in `build` task
// from build.gradle itself. Use this alias or `-PcombatantDev=true`.
tasks.register("buildDev") {
    group = "build"
    description = "Builds Combatant with development source set and dev metadata enabled."
    dependsOn "build"
    if (mixinValidationEnabled.get()) {
        dependsOn validateMixins
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/pivosos2007/combatant-client")
            credentials {
                username = findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: ""
                password = findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: System.getenv("GH_TOKEN") ?: ""
            }
        }
    }
}

